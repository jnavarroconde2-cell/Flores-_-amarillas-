<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA 360 - Fase 1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101820;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #interfaz {
      min-height: 58px;
      padding: 10px 14px;
      background: #182630;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 19px; color: #68e5bc; }
    #vida-contenedor { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    #vida-fondo {
      width: 120px; height: 13px; border: 1px solid #ffffff80;
      border-radius: 10px; overflow: hidden; background: #542e35;
    }
    #vida { width: 100%; height: 100%; background: #37d879; }
    #zona-juego {
      width: 100%; height: calc(100dvh - 58px);
      display: flex; align-items: center; justify-content: center; padding: 8px;
    }
    canvas {
      display: block; width: 100%; height: 100%; max-width: 1200px; max-height: 750px;
      background: #76ad51; border: 3px solid #405d45; border-radius: 6px;
      image-rendering: pixelated;
    }
    #ayuda {
      position: fixed; bottom: 13px; left: 50%; transform: translateX(-50%);
      background: #101820dd; padding: 7px 12px; border-radius: 8px;
      font-size: 12px; text-align: center; white-space: nowrap; pointer-events: none;
    }
    @media (max-width: 500px) {
      h1 { font-size: 15px; }
      #vida-fondo { width: 75px; }
      #interfaz { padding: 12px 8px; }
      #ayuda { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header id="interfaz">
    <h1>NEXORA 360</h1>
    <div id="vida-contenedor">
      <span>HP <b id="numero-vida">100</b></span>
      <div id="vida-fondo"><div id="vida"></div></div>
    </div>
  </header>

  <main id="zona-juego">
    <canvas id="juego" width="960" height="600" aria-label="Mundo de NEXORA 360"></canvas>
  </main>
  <div id="ayuda">Mover: WASD o flechas | Explora el mapa</div>

  <script>
    // 1. Preparar el área donde dibujamos el mundo.
    const canvas = document.getElementById("juego");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    // El mundo es más grande que la pantalla; la cámara seguirá al jugador.
    const mundo = { ancho: 1800, alto: 1200 };
    const camara = { x: 0, y: 0 };

    // 2. Personaje provisional. Más adelante puedes reemplazarlo por un PNG.
    const imagenPersonaje = new Image();
    imagenPersonaje.src = "imagenes/personaje.png";
    let imagenLista = false;
    imagenPersonaje.onload = () => { imagenLista = true; };
    imagenPersonaje.onerror = () => { imagenLista = false; };

    const jugador = {
      x: 180, y: 180, ancho: 36, alto: 44,
      velocidad: 190, vida: 100, caminando: false, tiempoAnimacion: 0
    };

    // 3. Detectar las teclas pulsadas.
    const teclas = {};
    window.addEventListener("keydown", (evento) => {
      const tecla = evento.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(tecla)) {
        evento.preventDefault();
      }
      teclas[tecla] = true;
    });
    window.addEventListener("keyup", (evento) => {
      teclas[evento.key.toLowerCase()] = false;
    });
    window.addEventListener("blur", () => {
      for (const tecla in teclas) teclas[tecla] = false;
    });

    // 4. Obstáculos: árboles y muros que bloquean el movimiento.
    const obstaculos = [
      { x: 330, y: 110, w: 60, h: 65 }, { x: 450, y: 200, w: 60, h: 65 },
      { x: 650, y: 100, w: 60, h: 65 }, { x: 780, y: 250, w: 60, h: 65 },
      { x: 1100, y: 120, w: 60, h: 65 }, { x: 1350, y: 190, w: 60, h: 65 },
      { x: 1550, y: 100, w: 60, h: 65 }, { x: 280, y: 430, w: 60, h: 65 },
      { x: 530, y: 500, w: 60, h: 65 }, { x: 920, y: 420, w: 60, h: 65 },
      { x: 1150, y: 530, w: 60, h: 65 }, { x: 1450, y: 420, w: 60, h: 65 },
      { x: 180, y: 800, w: 60, h: 65 }, { x: 430, y: 950, w: 60, h: 65 },
      { x: 700, y: 850, w: 60, h: 65 }, { x: 1000, y: 970, w: 60, h: 65 },
      { x: 1280, y: 850, w: 60, h: 65 }, { x: 1550, y: 1000, w: 60, h: 65 },
      { x: 600, y: 350, w: 140, h: 28 }, { x: 1000, y: 700, w: 180, h: 28 }
    ];

    // 5. Comprobar si el jugador choca con un obstáculo o sale del mapa.
    function hayColision(x, y) {
      if (x < 0 || y < 0 ||
          x + jugador.ancho > mundo.ancho ||
          y + jugador.alto > mundo.alto) return true;

      for (const o of obstaculos) {
        const toca = x < o.x + o.w && x + jugador.ancho > o.x &&
                     y < o.y + o.h && y + jugador.alto > o.y;
        if (toca) return true;
      }
      return false;
    }

    // 6. Actualizar movimiento, animación y cámara.
    function actualizar(delta) {
      let dx = 0, dy = 0;
      if (teclas["w"] || teclas["arrowup"]) dy -= 1;
      if (teclas["s"] || teclas["arrowdown"]) dy += 1;
      if (teclas["a"] || teclas["arrowleft"]) dx -= 1;
      if (teclas["d"] || teclas["arrowright"]) dx += 1;

      jugador.caminando = dx !== 0 || dy !== 0;
      // Evita que caminar en diagonal sea más rápido.
      if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }

      const pasoX = dx * jugador.velocidad * delta;
      const pasoY = dy * jugador.velocidad * delta;

      // Comprobar cada eje por separado permite deslizarse junto a las paredes.
      if (!hayColision(jugador.x + pasoX, jugador.y)) jugador.x += pasoX;
      if (!hayColision(jugador.x, jugador.y + pasoY)) jugador.y += pasoY;

      if (jugador.caminando) jugador.tiempoAnimacion += delta * 12;
      else jugador.tiempoAnimacion = 0;

      camara.x = jugador.x + jugador.ancho / 2 - canvas.width / 2;
      camara.y = jugador.y + jugador.alto / 2 - canvas.height / 2;
      camara.x = Math.max(0, Math.min(camara.x, mundo.ancho - canvas.width));
      camara.y = Math.max(0, Math.min(camara.y, mundo.alto - canvas.height));
    }

    // 7. Dibujar césped, detalles y caminos.
    function dibujarSuelo() {
      ctx.fillStyle = "#76ad51";
      ctx.fillRect(0, 0, mundo.ancho, mundo.alto);

      ctx.fillStyle = "#6da34b";
      for (let x = 0; x < mundo.ancho; x += 48) {
        for (let y = 0; y < mundo.alto; y += 48) {
          if ((x / 48 + y / 48) % 3 === 0) {
            ctx.fillRect(x + 12, y + 15, 3, 3);
            ctx.fillRect(x + 27, y + 31, 2, 2);
          }
        }
      }

      // Caminos de tierra.
      ctx.fillStyle = "#c9ae79";
      ctx.fillRect(0, 270, mundo.ancho, 55);
      ctx.fillRect(820, 270, 55, 550);
      ctx.fillRect(820, 780, 550, 50);

      // Límite visible del mapa.
      ctx.strokeStyle = "#304c35";
      ctx.lineWidth = 12;
      ctx.strokeRect(0, 0, mundo.ancho, mundo.alto);
    }

    // 8. Dibujar árboles y paredes.
    function dibujarObstaculos() {
      for (const o of obstaculos) {
        if (o.h > 40) {
          // Tronco.
          ctx.fillStyle = "#76502f";
          ctx.fillRect(o.x + 22, o.y + 35, 17, 30);
          // Copa del árbol.
          ctx.fillStyle = "#326c3b";
          ctx.beginPath(); ctx.arc(o.x + 30, o.y + 24, 32, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#448b49";
          ctx.beginPath(); ctx.arc(o.x + 20, o.y + 18, 20, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#62a957";
          ctx.beginPath(); ctx.arc(o.x + 39, o.y + 12, 14, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = "#6c777c";
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillStyle = "#899498";
          ctx.fillRect(o.x + 4, o.y + 4, o.w - 8, 5);
          ctx.strokeStyle = "#4a555b";
          ctx.strokeRect(o.x, o.y, o.w, o.h);
        }
      }
    }

    // 9. Dibujar el PNG si está disponible; si no, usar el personaje provisional.
    function dibujarJugador() {
      const salto = jugador.caminando
        ? Math.abs(Math.sin(jugador.tiempoAnimacion)) * 3 : 0;
      const x = jugador.x;
      const y = jugador.y - salto;

      if (imagenLista) {
        ctx.drawImage(imagenPersonaje, x, y, jugador.ancho, jugador.alto);
      } else {
        // Personaje provisional hecho con formas simples.
        ctx.fillStyle = "#263642";
        ctx.fillRect(x + 5, y + 12, 26, 30);
        ctx.fillStyle = "#f1c49b";
        ctx.fillRect(x + 8, y, 20, 20);
        ctx.fillStyle = "#4a83df";
        ctx.fillRect(x + 7, y + 20, 22, 15);
        ctx.fillStyle = "#30333b";
        ctx.fillRect(x + 7, y + 34, 8, 10);
        ctx.fillRect(x + 21, y + 34, 8, 10);
        ctx.fillStyle = "#202020";
        ctx.fillRect(x + 12, y + 8, 3, 3);
        ctx.fillRect(x + 21, y + 8, 3, 3);
      }
    }

    // 10. Dibujar el mundo siguiendo la cámara.
    function dibujar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-camara.x, -camara.y);
      dibujarSuelo();
      dibujarObstaculos();
      dibujarJugador();
      ctx.restore();
    }

    // 11. Bucle principal: actualizar y volver a dibujar cada fotograma.
    let tiempoAnterior = 0;
    function bucle(tiempoActual) {
      if (tiempoAnterior === 0) tiempoAnterior = tiempoActual;
      const delta = Math.min((tiempoActual - tiempoAnterior) / 1000, 0.05);
      tiempoAnterior = tiempoActual;
      actualizar(delta);
      dibujar();
      requestAnimationFrame(bucle);
    }
    requestAnimationFrame(bucle);
  </script>
</body>
</html>
