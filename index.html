<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V25 LORE GALACTICO</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:monospace}
canvas{display:block;width:100vw;height:100vh}
#lore{position:fixed;bottom:25px;left:15px;right:15px;color:#00ffcc;font-size:11px;letter-spacing:1px;z-index:5;pointer-events:none;line-height:16px}
#lore b{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lore"></div>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d');
function rs(){c.width=innerWidth; c.height=innerHeight} rs(); onresize=rs;
let yaw=0.3,pitch=-0.2,zoom=0.9,lastX=0,lastY=0,dragging=false;
let time=0,done=false;
const loreEl=document.getElementById('lore');
let anim={zoom:3.5,yaw:0,pitch:0,bh:3.5,blur:5,drag:false,lx:0,ly:0,ld:0};

const planets=[
 {dist:0,size:18,sun:true},{dist:26,size:3,color:'#aaa'},{dist:40,size:5.5,color:'#e6cdac'},{dist:56,size:6,color:'#2b82ff'},{dist:74,size:4.5,color:'#ff6a3d'},{dist:102,size:12,color:'#d8ca9d'},{dist:134,size:10.5,color:'#f7ec4f',hasRing:true},{dist:164,size:8.5,color:'#43b0f1'},{dist:194,size:8.5,color:'#2d5fcc'},
];
let stars=[]; for(let i=0;i<180;i++) stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()});

function drawSun(x,y,r){ ctx.save(); ctx.translate(x,y); ctx.shadowBlur=16; ctx.shadowColor='#ffaa00'; ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.shadowBlur=0; ctx.restore(); }
function drawBH(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,0,14,0,7); ctx.fill(); ctx.strokeStyle='#ffbb66'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.stroke(); ctx.restore(); }

function render(){
  let cx=innerWidth/2, cy=innerHeight/2.5;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,innerWidth,innerHeight);
  stars.forEach(s=>{ ctx.fillStyle=`rgba(200,220,255,${0.3+s.s*0.5})`; ctx.fillRect(s.x,s.y,1,1); });
  let bhX=cx+300*(1-anim.zoom), bhY=cy-180*(1-anim.zoom);
  drawBH(bhX,bhY,anim.bh);
  planets.forEach(p=>{
    let ang=time*(p.dist?0.22/p.dist:0); let x3=p.dist*Math.cos(ang), z3=p.dist*Math.sin(ang);
    let xr=x3*Math.cos(anim.yaw)-z3*Math.sin(anim.yaw); let zr=x3*Math.sin(anim.yaw)+z3*Math.cos(anim.yaw); let yr=-zr*Math.sin(anim.pitch);
    let sx=cx+xr*anim.zoom*1.8, sy=cy+yr*anim.zoom*1.8;
    if(p.dist!=0){ ctx.strokeStyle='rgba(0,255,255,0.15)'; ctx.beginPath(); ctx.ellipse(cx,cy,p.dist*anim.zoom*1.8,p.dist*anim.zoom*0.32,0,0,7); ctx.stroke(); }
    if(p.sun) drawSun(sx,sy,p.size*anim.zoom); else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,p.size*anim.zoom,0,7); ctx.fill(); }
  });
  time+=0.02;
  requestAnimationFrame(render);
}
render();

gsap.timeline({onComplete:()=>{done=true; loreEl.style.transition='opacity 1s'; loreEl.style.opacity='0'; c.style.filter='none';}})
.to(anim,{zoom:0.35,bh:0.6,yaw:0.8,blur:3,duration:2,ease:"power2.inOut",onUpdate:()=>{loreEl.innerHTML="<b>[0-2s] GARGANTUA</b><br>Escapando..."; c.style.filter=`blur(${anim.blur}px)`;}})
.to(anim,{zoom:0.35,yaw:2.5,blur:0,duration:2,ease:"power4.in",onUpdate:()=>{loreEl.innerHTML="<b>[2-4s] WARP 2.5c</b><br>Salto superluminico";}})
.to(anim,{zoom:0.6,blur:0,duration:2.5,ease:"power1.out",onUpdate:()=>{loreEl.innerHTML="<b>[4-6.5s] KUIPER</b><br>220 UA detectado";}})
.to(anim,{zoom:0.9,yaw:0.3,pitch:-0.2,bh:0.45,duration:1.5,ease:"power2.out",onUpdate:()=>{loreEl.innerHTML="<b>[6.5-8s] SISTEMA SOLAR</b><br>Entrada estabilizada"; c.style.filter='none';}});

c.addEventListener('touchstart',e=>{if(done){anim.drag=true; anim.lx=e.touches[0].clientX; anim.ly=e.touches[0].clientY;}});
c.addEventListener('touchmove',e=>{
 if(!done) return;
 if(e.touches.length==1 && anim.drag){ anim.yaw+=(e.touches[0].clientX-anim.lx)*0.005; anim.pitch+=(e.touches[0].clientY-anim.ly)*0.005; anim.lx=e.touches[0].clientX; anim.ly=e.touches[0].clientY; }
 if(e.touches.length==2){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(anim.ld) anim.zoom+=(d-anim.ld)*0.006; anim.ld=d; anim.zoom=Math.max(0.4,Math.min(4,anim.zoom)); }
 e.preventDefault();
},{passive:false});
c.addEventListener('touchend',()=>{anim.drag=false; anim.ld=0;});
</script>
</body>
</html>
