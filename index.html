<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONSTELACIÓN GALÁCTICA</title>
<style>
  body { margin:0; overflow:hidden; background:#02020a; font-family: 'Courier New', monospace; }
  canvas { display:block; }
  #hud {
    position:absolute; top:20px; left:20px; color:#00ffff;
    border:1px solid #00ffff; padding:12px 18px; background:rgba(0,255,255,0.05);
    box-shadow:0 0 20px #00ffff66; backdrop-filter: blur(5px);
  }
  #hud h1 { margin:0; font-size:14px; letter-spacing:3px; }
  #hud p { margin:5px 0 0 0; font-size:10px; opacity:0.7; }
</style>
</head>
<body>
<div id="hud">
  <h1>▣ SISTEMA GALÁCTICO ▣</h1>
  <p>> CONSTELACIÓN ACTIVA</p>
  <p>> NODOS: 150</p>
  <p id="coords">> COORD: 0,0</p>
</div>
<canvas id="galaxy"></canvas>
<script>
const canvas = document.getElementById('galaxy');
const ctx = canvas.getContext('2d');
let w, h, mouse = {x:-1000, y:-1000};
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  mouse.x=e.clientX; mouse.y=e.clientY;
  document.getElementById('coords').innerText = `> COORD: ${e.clientX},${e.clientY}`;
});
resize();
class Star {
  constructor(){
    this.x=Math.random()*w; this.y=Math.random()*h;
    this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5;
    this.r=Math.random()*1.5+0.5; this.pulse=Math.random()*Math.PI*2;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.pulse+=0.02; if(this.x<0||this.x>w) this.vx*=-1; if(this.y<0||this.y>h) this.vy*=-1; }
  draw(){
    let glow = Math.sin(this.pulse)*0.5+1;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r*glow, 0, Math.PI*2);
    ctx.fillStyle=`rgba(${100+glow*50}, ${200+glow*30}, 255, ${0.5+glow*0.3})`;
    ctx.shadowBlur=10*glow; ctx.shadowColor='#00ffff'; ctx.fill(); ctx.shadowBlur=0;
  }
}
const stars = Array.from({length:150}, ()=>new Star());
function animate(){
  ctx.fillStyle='rgba(2,2,10,0.2)'; ctx.fillRect(0,0,w,h);
  stars.forEach(s=>{ s.update(); s.draw(); });
  for(let i=0;i<stars.length;i++){
    for(let j=i+1;j<stars.length;j++){
      let dx=stars[i].x-stars[j].x, dy=stars[i].y-stars[j].y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<130){
        ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[j].x, stars[j].y);
        ctx.strokeStyle=`rgba(0,255,255,${1-dist/130})`; ctx.lineWidth=0.4; ctx.stroke();
      }
    }
    let dmx=stars[i].x-mouse.x, dmy=stars[i].y-mouse.y;
    let dmouse=Math.sqrt(dmx*dmx+dmy*dmy);
    if(dmouse<180){
      ctx.beginPath(); ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(mouse.x, mouse.y);
      ctx.strokeStyle=`rgba(255,0,255,${1-dmouse/180})`; ctx.lineWidth=0.8; ctx.stroke();
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
